# GitHub Pages — static Next.js export
#
# Repository secrets:
#   NEXT_PUBLIC_API_URL  Cloud Run URL baked into the shop client (required)
#
# Repository variables:
#   CUSTOM_DOMAIN        "true" to drop /dkeramik basePath
#
# next.config.mjs reads GITHUB_PAGES=true for the /dkeramik subpath.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/ci.yml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --watchAll=false
      - name: Require shop API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "Set repository secret NEXT_PUBLIC_API_URL to the Cloud Run HTTPS URL."
            exit 1
          fi
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'false' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
